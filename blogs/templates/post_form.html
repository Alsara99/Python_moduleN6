{% extends 'base.html' %}

{% block title %}Форма книги{% endblock %}

{% block content %}
{% include 'header.html' %}
<h2>Форма поста</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <a href="{% url 'posts' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
