{% extends 'base.html' %}

{% block title %}Добавить/Редактировать продукт{% endblock %}

{% block content %}
<h2>{{ view.title }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <button type="button" class="btn btn-primary" onclick="window.location.href='http://127.0.0.1:8000/catalog'">Отмена</button>
</form>
{% endblock %}
