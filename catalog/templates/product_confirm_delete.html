{% extends 'base.html' %}

{% block title %}Удалить продукт{% endblock %}

{% block content %}
<h2>Удалить продукт</h2>
<p>Вы уверены, что хотите удалить "{{ product.name }}"?</p>
<form method="post">
    {% csrf_token %}
    {% if perms.catalog.can_unpublish_product %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    {% endif %}
    <a onclick="window.location.href='http://127.0.0.1:8000/catalog'" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
